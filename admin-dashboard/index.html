<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUTRA Control</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">

<!-- Sign-in gate. An operator is a Supabase user listed in the operators table. -->
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card" autocomplete="on">
    <span class="brand"><span class="brand-mark">◎</span> sutra control</span>
    <h1>Operator sign-in</h1>
    <p class="muted">Live fleet telemetry. Access is granted per account.</p>

    <label class="label" for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="ops@example.com" required>

    <label class="label" for="password">Password</label>
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password" required>

    <p id="gate-error" class="error" hidden></p>
    <button class="pill accent" id="gate-submit" type="submit">Sign in</button>
  </form>
</div>

<main id="console" class="shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="brand"><span class="brand-mark">◎</span> sutra control</span>
      <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">&#9096;</button>
    </div>

    <div class="search">
      <input id="search" type="search" placeholder="Search vehicle or driver..." aria-label="Search fleet">
      <span class="search-icon" aria-hidden="true">&#9906;</span>
    </div>

    <div class="filters">
      <div class="filter-group">
        <small class="muted">Show me</small>
        <div class="chips" id="filter-chips" role="group" aria-label="Filter fleet">
          <button class="chip active" data-filter="all" type="button">All</button>
          <button class="chip" data-filter="emergency" type="button">Emergency</button>
          <button class="chip" data-filter="speeding" type="button">Speeding</button>
        </div>
      </div>
      <div class="filter-group">
        <small class="muted">Sort by</small>
        <div class="chips" id="sort-chips" role="group" aria-label="Sort fleet">
          <button class="chip active" data-sort="plate" type="button">Plate</button>
          <button class="chip" data-sort="speed" type="button">Speed</button>
        </div>
      </div>
    </div>

    <div class="list-head">
      <strong id="fleet-count">0 vehicles</strong>
      <span class="conn"><i id="live-dot" class="dot"></i><small id="conn-state">connecting</small></span>
    </div>

    <div id="vehicle-list" class="list"></div>

    <div class="events-head">
      <small class="muted">Events</small>
      <small class="muted" id="violation-count">0 speeding</small>
    </div>
    <div id="log" class="log"></div>
  </aside>

  <section class="map-wrap">
    <div id="map" class="map"></div>
    <button class="fit-btn" id="fit-all" type="button">Fit all</button>
    <div id="detail" class="detail" hidden></div>
  </section>
</main>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
